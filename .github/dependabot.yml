version: 2

updates:
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 10
      commit-message:
          prefix: 'composer'
      labels:
          - 'dependencies'
          - 'php'
      # Patch and minor bumps land in one weekly PR, so they no longer fight
      # over composer.lock. Majors stay separate PRs for manual review.
      groups:
          composer-minor-patch:
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'npm'
      labels:
          - 'dependencies'
          - 'frontend'
      # Same as composer: one weekly PR for patch and minor, majors separate.
      groups:
          npm-minor-patch:
              update-types:
                  - 'minor'
                  - 'patch'
